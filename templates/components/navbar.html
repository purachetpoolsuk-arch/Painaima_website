{% load static %}

<!-- Top Header Navigation Bar (Clean Header) -->
<header class="app-top-header">
  <div class="header-inner">
    <!-- Brand Logo -->
    <a href="{% url 'core:feed' %}" class="brand-logo-header">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <span class="brand-name">Painaima</span>
    </a>

    <!-- Top Right Actions -->
    <div style="display: flex; align-items: center; gap: 12px;">
      
      {% if user.is_authenticated %}
        <!-- Create Post Button -->
        <a href="{% url 'posts:post_create' %}" class="btn btn-primary btn-sm" style="border-radius: var(--radius-full); padding: 7px 16px; font-weight: 700; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="hide-on-mobile">สร้างโพสต์</span>
        </a>

        <!-- Direct Messages / Chat Icon -->
        <a href="{% url 'chat:inbox' %}" class="header-action-icon {% if 'chat' in request.resolver_match.app_names %}active{% endif %}" title="ข้อความ (แชท)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <span id="nav-unread-badge-top" class="nav-badge" style="display: none;"></span>
        </a>

        <!-- Logout Button -->
        <a href="{% url 'account_logout' %}" title="ออกจากระบบ" class="header-action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </a>
      {% else %}
        <a href="{% url 'account_login' %}" class="btn btn-primary btn-sm">เข้าสู่ระบบ</a>
      {% endif %}

    </div>
  </div>
</header>

<!-- Bottom Navigation Bar (Fixed at bottom for mobile) -->
<nav class="bottom-nav-bar">
  <div class="bottom-nav-inner">
    <!-- Home Tab -->
    <a href="{% url 'core:feed' %}" class="bottom-nav-item {% if request.resolver_match.view_name == 'core:feed' %}active{% endif %}" title="หน้าหลัก">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="bottom-nav-label">หน้าหลัก</span>
    </a>

    <!-- Explore Tab -->
    <a href="{% url 'core:explore' %}" class="bottom-nav-item {% if request.resolver_match.view_name == 'core:explore' %}active{% endif %}" title="สำรวจ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="bottom-nav-label">สำรวจ</span>
    </a>

    <!-- Create Post Tab -->
    <a href="{% url 'posts:post_create' %}" class="bottom-nav-item bottom-nav-center-btn {% if request.resolver_match.view_name == 'posts:post_create' %}active{% endif %}" title="สร้างโพสต์">
      <div class="center-btn-bubble">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>
      <span class="bottom-nav-label">โพสต์</span>
    </a>

    <!-- Messages / Chat Tab -->
    {% if user.is_authenticated %}
      <a href="{% url 'chat:inbox' %}" class="bottom-nav-item {% if 'chat' in request.resolver_match.app_names %}active{% endif %}" title="ข้อความ">
        <div style="position: relative; display: inline-block;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <span id="nav-unread-badge-bottom" class="nav-badge" style="display: none;"></span>
        </div>
        <span class="bottom-nav-label">ข้อความ</span>
      </a>
    {% endif %}

    <!-- Profile Tab -->
    {% if user.is_authenticated %}
      <a href="{% url 'accounts:profile' username=user.username %}" class="bottom-nav-item {% if request.resolver_match.kwargs.username == user.username and request.resolver_match.url_name == 'profile' %}active{% endif %}" title="โปรไฟล์">
        <div class="avatar-bottom-ring {% if request.resolver_match.kwargs.username == user.username and request.resolver_match.url_name == 'profile' %}active{% endif %}">
          <img src="{{ user.profile.avatar_url }}" class="avatar-sm" style="width: 24px; height: 24px;" alt="{{ user.username }}">
        </div>
        <span class="bottom-nav-label">โปรไฟล์</span>
      </a>
    {% else %}
      <a href="{% url 'account_login' %}" class="bottom-nav-item" title="เข้าสู่ระบบ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="bottom-nav-label">เข้าสู่ระบบ</span>
      </a>
    {% endif %}
  </div>
</nav>

<script>
  // Periodic check for unread chat messages badge
  {% if user.is_authenticated %}
  document.addEventListener('DOMContentLoaded', () => {
    checkUnreadMessages();
    setInterval(checkUnreadMessages, 15000);
  });

  async function checkUnreadMessages() {
    try {
      const res = await fetch("{% url 'chat:api_unread_count' %}");
      const data = await res.json();
      const topBadge = document.getElementById('nav-unread-badge-top');
      const bottomBadge = document.getElementById('nav-unread-badge-bottom');

      if (data.unread_count > 0) {
        if (topBadge) {
          topBadge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
          topBadge.style.display = 'flex';
        }
        if (bottomBadge) {
          bottomBadge.textContent = data.unread_count > 99 ? '99+' : data.unread_count;
          bottomBadge.style.display = 'flex';
        }
      } else {
        if (topBadge) topBadge.style.display = 'none';
        if (bottomBadge) bottomBadge.style.display = 'none';
      }
    } catch (e) {}
  }
  {% endif %}
</script>
