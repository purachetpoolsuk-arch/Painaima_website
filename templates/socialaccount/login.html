{% load static %}
{% load i18n %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงชื่อเข้าใช้ด้วย Google - ไปไหนมา (Painaima)</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-wrapper">

  <div class="auth-card" style="text-align: center;">
    
    <div class="auth-header" style="margin-bottom: 24px;">
      <!-- Google Logo Circle -->
      <div style="width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--bg-card); border: 1px solid var(--border-active); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px auto; box-shadow: var(--shadow-md);">
        <svg width="28" height="28" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.1-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 6.3 10.1 6.3z"/>
        </svg>
      </div>
      <h1 class="auth-title" style="font-size: 1.4rem;">ลงชื่อเข้าใช้ด้วย Google</h1>
      <p class="auth-subtitle" style="font-size: 0.88rem; margin-top: 6px;">
        คุณกำลังจะเชื่อมต่อเข้าสู่ระบบ Painaima โดยใช้บัญชี Google
      </p>
    </div>

    <!-- Confirm Form -->
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; gap: 10px; font-weight: 700;">
        <span>ดำเนินการต่อด้วย Google</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </form>

    <div style="margin-top: 20px;">
      <a href="{% url 'account_login' %}" style="color: var(--text-muted); font-size: 0.85rem;">
        &larr; ยกเลิกและกลับไปหน้าเข้าสู่ระบบ
      </a>
    </div>

  </div>

</body>
</html>
