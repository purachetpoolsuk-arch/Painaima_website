{% load static %}
<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เลือกบัญชี Google - ไปไหนมา (Painaima)</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    .google-account-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      text-align: left;
    }
    .google-account-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-active);
      transform: translateY(-1px);
    }
    .google-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="auth-wrapper">

  <div class="auth-card" style="max-width: 460px; padding: 32px 28px;">
    
    <!-- Google Logo Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 48px; height: 48px; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center;">
        <svg width="40" height="40" viewBox="0 0 24 24">
          <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
          <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5.1 3.7-8.8z"/>
          <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3 0-.8.1-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
          <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 6.3 10.1 6.3z"/>
        </svg>
      </div>
      <h1 class="auth-title" style="font-size: 1.45rem; margin-bottom: 4px;">เลือกบัญชี</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">เพื่อดำเนินการต่อไปยัง <strong>Painaima</strong></p>
    </div>

    <!-- Account Selection Form List -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px;">
      
      <!-- Option 1: Aunpu -->
      <form method="POST" action="{% url 'accounts:demo_google_login' %}">
        {% csrf_token %}
        <input type="hidden" name="name" value="Aunpu">
        <input type="hidden" name="email" value="aunpu2588@gmail.com">
        <button type="submit" class="google-account-item">
          <div class="google-avatar" style="background: linear-gradient(135deg, #3b82f6, #8b5cf6);">A</div>
          <div style="flex: 1; overflow: hidden;">
            <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary);">Aunpu</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">aunpu2588@gmail.com</div>
          </div>
        </button>
      </form>

      <!-- Option 2: Ploy -->
      <form method="POST" action="{% url 'accounts:demo_google_login' %}">
        {% csrf_token %}
        <input type="hidden" name="name" value="Ploy Cafe">
        <input type="hidden" name="email" value="ploy.cafehopping@gmail.com">
        <button type="submit" class="google-account-item">
          <div class="google-avatar" style="background: linear-gradient(135deg, #ec4899, #f43f5e);">P</div>
          <div style="flex: 1; overflow: hidden;">
            <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary);">Ploy Cafehopping</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">ploy.cafehopping@gmail.com</div>
          </div>
        </button>
      </form>

      <!-- Option 3: Nat -->
      <form method="POST" action="{% url 'accounts:demo_google_login' %}">
        {% csrf_token %}
        <input type="hidden" name="name" value="Nat Traveler">
        <input type="hidden" name="email" value="nat.traveler@gmail.com">
        <button type="submit" class="google-account-item">
          <div class="google-avatar" style="background: linear-gradient(135deg, #10b981, #06b6d4);">N</div>
          <div style="flex: 1; overflow: hidden;">
            <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-primary);">Nat Traveler</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">nat.traveler@gmail.com</div>
          </div>
        </button>
      </form>

      <!-- Option 4: Custom Account Toggle -->
      <button type="button" class="google-account-item" onclick="toggleCustomGoogleInput()" style="border-style: dashed;">
        <div class="google-avatar" style="background: rgba(255,255,255,0.1); color: var(--text-secondary);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div style="flex: 1; font-weight: 600; font-size: 0.92rem; color: var(--accent-cyan);">
          ใช้บัญชี Google อื่นๆ...
        </div>
      </button>

      <!-- Custom Account Form (Initially Hidden) -->
      <div id="custom-google-box" style="display: none; background: rgba(0,0,0,0.3); border: 1px solid var(--border-active); border-radius: var(--radius-md); padding: 16px; margin-top: 6px;">
        <form method="POST" action="{% url 'accounts:demo_google_login' %}">
          {% csrf_token %}
          <div class="form-group" style="margin-bottom: 12px;">
            <label class="form-label" style="font-size: 0.8rem;">ชื่อผู้ใช้ / Display Name</label>
            <input type="text" name="name" class="form-input" placeholder="เช่น John Doe" required>
          </div>
          <div class="form-group" style="margin-bottom: 14px;">
            <label class="form-label" style="font-size: 0.8rem;">อีเมล Google (@gmail.com)</label>
            <input type="email" name="email" class="form-input" placeholder="your_name@gmail.com" required>
          </div>
          <button type="submit" class="btn btn-primary btn-md" style="width: 100%;">
            เข้าสู่ระบบด้วยบัญชีนี้ &rarr;
          </button>
        </form>
      </div>

    </div>

    <div style="text-align: center; margin-top: 16px;">
      <a href="{% url 'account_login' %}" style="color: var(--text-muted); font-size: 0.85rem;">
        &larr; ยกเลิกและกลับไปหน้าเข้าสู่ระบบปกติ
      </a>
    </div>

  </div>

  <script>
    function toggleCustomGoogleInput() {
      const box = document.getElementById('custom-google-box');
      if (box.style.display === 'none') {
        box.style.display = 'block';
      } else {
        box.style.display = 'none';
      }
    }
  </script>

</body>
</html>
