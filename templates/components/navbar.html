{% load static %}

<!-- Top Header Navigation Bar (Clean Instagram Header) -->
<header class="app-top-header">
  <div class="header-inner">
    <!-- Brand Logo -->
    <a href="{% url 'core:feed' %}" class="brand-logo-header">
      <div class="brand-icon" style="width: 34px; height: 34px; border-radius: var(--radius-md); font-size: 1.1rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
      </div>
      <span class="brand-name" style="font-size: 1.35rem;">Painaima</span>
    </a>

    <!-- Top Right Actions -->
    <div style="display: flex; align-items: center; gap: 14px;">
      <a href="{% url 'posts:post_create' %}" class="btn btn-primary btn-sm" style="border-radius: var(--radius-full); padding: 7px 16px; font-weight: 700; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>สร้างโพสต์</span>
      </a>

      {% if user.is_authenticated %}
        <a href="{% url 'account_logout' %}" title="ออกจากระบบ" style="color: var(--text-muted); width: 34px; height: 34px; border-radius: var(--radius-full); background: var(--bg-card); display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-subtle); transition: all var(--transition-fast);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </a>
      {% else %}
        <a href="{% url 'account_login' %}" class="btn btn-secondary btn-sm">เข้าสู่ระบบ</a>
      {% endif %}
    </div>
  </div>
</header>

<!-- Bottom Navigation Bar (Fixed at bottom like Instagram) -->
<nav class="bottom-nav-bar">
  <div class="bottom-nav-inner">
    <!-- Home Tab -->
    <a href="{% url 'core:feed' %}" class="bottom-nav-item {% if request.resolver_match.view_name == 'core:feed' %}active{% endif %}" title="หน้าหลัก">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="bottom-nav-label">หน้าหลัก</span>
    </a>

    <!-- Explore Tab -->
    <a href="{% url 'core:explore' %}" class="bottom-nav-item {% if request.resolver_match.view_name == 'core:explore' %}active{% endif %}" title="สำรวจ">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span class="bottom-nav-label">สำรวจ</span>
    </a>

    <!-- Create Post / Story Tab -->
    <a href="{% url 'posts:post_create' %}" class="bottom-nav-item bottom-nav-center-btn {% if request.resolver_match.view_name == 'posts:post_create' %}active{% endif %}" title="สร้างโพสต์">
      <div class="center-btn-bubble">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>
      <span class="bottom-nav-label">สร้างโพสต์</span>
    </a>

    <!-- Profile Tab -->
    {% if user.is_authenticated %}
      <a href="{% url 'accounts:profile' username=user.username %}" class="bottom-nav-item {% if request.resolver_match.kwargs.username == user.username and request.resolver_match.url_name == 'profile' %}active{% endif %}" title="โปรไฟล์">
        <div class="avatar-bottom-ring {% if request.resolver_match.kwargs.username == user.username and request.resolver_match.url_name == 'profile' %}active{% endif %}">
          <img src="{{ user.profile.avatar_url }}" class="avatar-sm" style="width: 26px; height: 26px;" alt="{{ user.username }}">
        </div>
        <span class="bottom-nav-label">โปรไฟล์</span>
      </a>
    {% else %}
      <a href="{% url 'account_login' %}" class="bottom-nav-item" title="เข้าสู่ระบบ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span class="bottom-nav-label">เข้าสู่ระบบ</span>
      </a>
    {% endif %}
  </div>
</nav>
